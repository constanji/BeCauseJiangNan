[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:openapi]
command=/bin/sh -c 'java %(ENV_JAVA_OPTS)s -Ddat.logs.root.path=/app/logs -jar /app/dat-cli-*.jar server openapi --mongodb --mongo-uri="%(ENV_MONGODB_URI)s" --mongo-database="%(ENV_MONGODB_DATABASE)s"'
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=10
stdout_logfile=/app/logs/openapi.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/app/logs/openapi-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
environment=MONGODB_URI="%(ENV_MONGODB_URI)s",MONGODB_DATABASE="%(ENV_MONGODB_DATABASE)s",SERVER_PORT="%(ENV_OPENAPI_PORT)s"

[program:mcp]
command=/bin/sh -c 'java %(ENV_JAVA_OPTS)s -Ddat.logs.root.path=/app/logs -jar /app/dat-cli-*.jar server mcp --mongodb --mongo-uri="%(ENV_MONGODB_URI)s" --mongo-database="%(ENV_MONGODB_DATABASE)s"'
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=10
stdout_logfile=/app/logs/mcp.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/app/logs/mcp-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
environment=MONGODB_URI="%(ENV_MONGODB_URI)s",MONGODB_DATABASE="%(ENV_MONGODB_DATABASE)s",SERVER_PORT="%(ENV_MCP_PORT)s"
