
<!DOCTYPE html>
<html lang="">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>因为智能</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #111827;
            }
        }

        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
        }

        .logo-img {
            height: 150px;
            width: auto;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: .7;
                transform: scale(0.95);
            }
        }
    </style>
</head>

<body>
<div id="app">
    <div class="loading-container">
        <img src="/src/assets/logo.svg" class="logo-img" alt="BeCause Logo" />
    </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
