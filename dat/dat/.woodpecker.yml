# DAT CI/CD Pipeline (Socket 模式)
#
# Server 建议同时调大全局超时（分钟）：
#   WOODPECKER_MAX_WORKFLOW_TIMEOUT=180
#
# 首次运行前在宿主机执行：
#   mkdir -p /var/cache/dat-maven
#   mkdir -p /var/cache/dat-repo

skip_clone: true

when:
  branch: master
  event: [push, tag]

steps:
  clone:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/alpine/git:v2.49.0
    volumes:
      - /var/cache/dat-repo:/cache/dat-repo
    timeout: 10m
    commands:
      - |
        if [ -d /cache/dat-repo/.git ]; then
          echo "=== 增量更新（跳过全量克隆）==="
          cd /cache/dat-repo
          git remote set-url origin http://8.130.12.35:3000/BecaueAI/dat.git
          git fetch --depth=1 origin master
          git reset --hard FETCH_HEAD
          git clean -fd
        else
          echo "=== 首次克隆 ==="
          git clone --depth=1 http://8.130.12.35:3000/BecaueAI/dat.git /cache/dat-repo
        fi
      - cp -r /cache/dat-repo/. $CI_WORKSPACE

  build-docker:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/docker:24-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/cache/dat-maven:/var/cache/dat-maven
    environment:
      DOCKER_BUILDKIT: "1"
    timeout: 3h
    commands:
      - mkdir -p /var/cache/dat-maven
      - docker pull localhost:5000/dat:latest || true
      - >
        docker build
        --build-arg BUILDKIT_INLINE_CACHE=1
        --cache-from localhost:5000/dat:latest
        -t localhost:5000/dat:latest
        -f Dockerfile .
      - docker push localhost:5000/dat:latest

  deploy:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/docker:24-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    timeout: 30m
    commands:
      - docker stop dat-app 2>/dev/null || true
      - docker rm dat-app 2>/dev/null || true
      - docker compose up -d --no-build --pull never --remove-orphans dat-app
      - echo "DAT deployed successfully!"
      - docker ps | grep dat-app