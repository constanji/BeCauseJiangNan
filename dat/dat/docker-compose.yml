# ============================================================
# DAT Docker Compose
# ============================================================



services:
  # MongoDB
  mongodb:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mongo:7.0
    container_name: dat-mongodb
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-Ee037159!}
    # 部分宿主默认 seccomp 与内核不兼容会导致容器 OCI permission denied
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped
    networks:
      - dat-network

  # PgVector (PostgreSQL with vector extension)
  pgvector:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/pgvector/pgvector:pg16
    container_name: dat-pgvector
    ports:
      - "${PGVECTOR_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=dat
      - POSTGRES_PASSWORD=dat123
      - POSTGRES_DB=dat_embeddings
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dat -d dat_embeddings" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped
    networks:
      - dat-network

  # DAT Application (OpenAPI + MCP)
  dat-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost:5000/dat:latest
    container_name: dat-app
    ports:
      - "${OPENAPI_PORT:-8080}:8080"
      - "${MCP_PORT:-8081}:8081"
    environment:
      - JAVA_OPTS=${JAVA_OPTS:--Xms512m -Xmx2g -Dfile.encoding=UTF-8}
      - TZ=Asia/Shanghai
      - OPENAPI_PORT=8080
      - MCP_PORT=8081
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-Ee037159!}@dat-mongodb:27017/dat?authSource=admin
      - MONGODB_DATABASE=dat
    volumes:
      - dat-logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped
    networks:
      - dat-network

networks:
  dat-network:
    driver: bridge

volumes:
  mongodb-data:
  pgvector-data:
  dat-logs:
