<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ESB Adapter 配置</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

    <div class="page">
      <header class="topbar">
        <div>
          <div class="brand">ESB Adapter</div>
          <div class="sub">运行时配置 · 保存后立即生效，无需重启容器</div>
        </div>
        <div class="topbar-actions">
          <span id="authBadge" class="badge">鉴权：检测中</span>
          <button type="button" id="btnSecret" class="btn ghost">访问密钥</button>
          <button type="button" id="btnReload" class="btn ghost" title="从服务器重新拉取当前生效配置（含热更新覆盖层）">重新加载</button>
        </div>
      </header>

      <main class="card">
        <form id="configForm"></form>
        <div class="form-actions">
          <button
            type="button"
            id="btnReset"
            class="btn danger ghost"
            title="删除 runtime-config.json，恢复为启动时的环境变量 / .env"
          >
            恢复环境变量默认
          </button>
          <div class="spacer"></div>
          <button type="submit" form="configForm" id="btnSave" class="btn primary">保存并热更新</button>
        </div>
        <p class="footnote">
          管理页保存写入 <code id="runtimePath">data/runtime-config.json</code>（覆盖层），
          <strong>不会改 .env</strong>；带「已覆盖」的项即来自该文件。
          「重新加载」只重新拉取生效值；要去掉覆盖请点「恢复环境变量默认」。
          Docker 下该文件挂在容器 <code>./data</code> 卷，重启后仍保留。转发入口仍为
          <code>POST /esb/transaction</code>；PORT 需改环境变量并重启。
        </p>
      </main>
    </div>

    <dialog id="secretDialog">
      <form method="dialog" class="dialog-body" id="secretForm">
        <h2>管理端访问密钥</h2>
        <p class="help">对应服务器 <code>ESB_ADMIN_SECRET</code>；未配置或为 change-me 时可不填。</p>
        <label>
          密钥
          <input type="password" id="secretInput" autocomplete="off" />
        </label>
        <div class="dialog-actions">
          <button type="submit" class="btn primary" value="ok">确定</button>
          <button type="submit" class="btn ghost" value="cancel">取消</button>
        </div>
      </form>
    </dialog>

    <script src="./app.js"></script>
  </body>
</html>
